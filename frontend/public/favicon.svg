<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Vibrant Medical Gradient Background -->
    <linearGradient id="med-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    
    <!-- Pill Capsule Gradient -->
    <linearGradient id="pill-cap-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Bell Glow Drop Shadow -->
    <filter id="med-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#312E81" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="8" y="8" width="104" height="104" rx="30" fill="url(#med-bg-grad)" filter="url(#med-shadow)" />

  <!-- Medication Capsule Pill Icon (Angled) -->
  <g transform="translate(60, 52) rotate(-35)">
    <!-- Pill Top Half (White) -->
    <path d="M -16, -26 A 16,16 0 0,1 16, -26 L 16, 0 L -16, 0 Z" fill="#FFFFFF" />
    <!-- Pill Bottom Half (Emerald Green) -->
    <path d="M -16, 0 L 16, 0 L 16, 26 A 16,16 0 0,1 -16, 26 Z" fill="url(#pill-cap-grad)" />
    <!-- Center Line -->
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#0F172A" stroke-width="2.5" opacity="0.2" />
    <!-- Pill Shine Accent -->
    <path d="M -9, -22 A 10,10 0 0,1 -2, -24 L -2, -6 L -9, -6 Z" fill="#FFFFFF" opacity="0.3" />
  </g>

  <!-- Reminder Alarm Bell Overlay (Bottom Right Badge) -->
  <g transform="translate(72, 70)">
    <!-- Bell Outer Ring Glow -->
    <circle cx="12" cy="12" r="18" fill="#F59E0B" />
    <circle cx="12" cy="12" r="15" fill="#FBBF24" />
    <!-- Bell Icon White -->
    <path d="M 12,4 C 8.6,4 6,6.6 6,10 L 6,14 L 4,16 L 4,17 L 20,17 L 20,16 L 18,14 L 18,10 C 18,6.6 15.4,4 12,4 Z M 10,18 C 10,19.1 10.9,20 12,20 C 13.1,20 14,19.1 14,18 Z" fill="#FFFFFF" />
  </g>
</svg>